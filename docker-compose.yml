# =============================================================================
#  WhatsApp AI 客服 —— 一键部署
#
#  正常情况下你不需要改这个文件。所有要填的东西都在 .env 里，
#  而 .env 是安装脚本自动生成的。
#
#  三个容器：
#    caddy    对外的 HTTPS 入口，自动申请和续期证书
#    app      主应用（后端 + 网页后台）
#    updater  更新执行器，只在内网，不对外
# =============================================================================

services:
  # ---------------------------------------------------------------------------
  # 入口：自动 HTTPS
  # ---------------------------------------------------------------------------
  caddy:
    image: caddy:2.8-alpine
    container_name: wacs_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS}
      ACME_EMAIL: ${ACME_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data     # 证书存这里，千万别删，否则会重复申请触发限流
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - wacs

  # ---------------------------------------------------------------------------
  # 主应用
  # ---------------------------------------------------------------------------
  app:
    image: ${APP_IMAGE:-ghcr.io/oceanlightglobal/wa-cs:latest}
    container_name: wacs_app
    restart: unless-stopped
    environment:
      APP_VERSION: ${APP_VERSION:-1.0.1}
      DATA_DIR: /data
      PORT: "3000"
      PUBLIC_URL: ${PUBLIC_URL}
      TZ: ${TZ:-Asia/Kuala_Lumpur}
      LOG_LEVEL: ${LOG_LEVEL:-info}

      # 安装脚本生成的初始登录密码。只在数据库里还没有密码时生效一次；
      # 客户在向导第一步改掉之后，这一项就不再起作用。
      INITIAL_ADMIN_PASSWORD: ${INITIAL_ADMIN_PASSWORD:-}

      # 版本清单：你发新版时改这个 JSON，客户后台就能检查到更新
      VERSION_MANIFEST_URL: ${VERSION_MANIFEST_URL:-}

      # 一键更新：应用通过内网调用 updater
      UPDATER_URL: http://updater:9000
      UPDATER_TOKEN: ${UPDATER_TOKEN}

      # AI 网关默认值（客户可在后台改成任意 OpenAI 兼容接口）
      DEFAULT_AI_BASE_URL: ${DEFAULT_AI_BASE_URL:-}
      DEFAULT_AI_API_KEY: ${DEFAULT_AI_API_KEY:-}
      DEFAULT_AI_MODEL: ${DEFAULT_AI_MODEL:-gpt-4o-mini}
    volumes:
      - app_data:/data
    networks:
      - wacs
    # 不映射端口：外部只能经 caddy 访问

  # ---------------------------------------------------------------------------
  # 更新执行器
  #
  # ⚠️ 它挂载了 docker.sock，等于持有宿主机 Docker 的控制权。
  #    这是「后台点一下就更新」的代价。安全上做了三重约束：
  #      1. 不映射任何端口，只有内网的 app 能访问；
  #      2. 只接受一个固定动作，不接受任何请求参数；
  #      3. 必须带 UPDATER_TOKEN。
  #    如果你不接受这个风险：把这个服务连同 app 的 UPDATER_URL 一起删掉，
  #    后台的更新按钮会自动降级成「显示一条命令让你手动执行」。
  # ---------------------------------------------------------------------------
  updater:
    image: ${UPDATER_IMAGE:-ghcr.io/oceanlightglobal/wa-cs-updater:latest}
    container_name: wacs_updater
    restart: unless-stopped
    environment:
      UPDATER_TOKEN: ${UPDATER_TOKEN}
      PROJECT_DIR: /project
      UPDATE_SERVICES: app
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      # 需要能读到 compose 文件和 .env 才能执行 docker compose
      - ./:/project:ro
    networks:
      - wacs

networks:
  wacs:
    driver: bridge

volumes:
  app_data:
  caddy_data:
  caddy_config:
