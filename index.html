<h1>💬 WhatsApp AI 客服</h1>
<p>在你的服务器上执行这一条命令即可安装：</p>
<pre><code>curl -fsSL https://oceanlightglobal.github.io/wa-cs-install/install.sh | sudo bash</code></pre>
<p class="muted">安装完成后，屏幕会打印后台地址和初始密码。</p>
<h3>系统要求</h3>
<ul class="muted">
  <li>Ubuntu 22.04 或 24.04</li>
  <li>1GB 以上内存（建议 2GB）</li>
  <li>80 和 443 端口未被占用，且在云平台安全组里已放行</li>
</ul>
<p class="muted">不需要买域名——安装脚本会自动生成一个带 HTTPS 证书的地址。</p>
